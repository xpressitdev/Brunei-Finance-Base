<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--app-font-sans)}
  .stack > * + *{margin-top:12px}
  .row{display:flex;align-items:baseline;gap:14px}
  .meta{font-size:11px;color:hsl(var(--muted-foreground));font-family:var(--app-font-mono);min-width:90px}
  .num{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
</style></head>
<body>
<div class="stack">
  <div class="row"><div class="meta">body 15/1.55</div><p style="margin:0;max-width:420px">Track your salary, manage your commitments, and stay on top of your loans — without the stress.</p></div>
  <div class="row"><div class="meta">small 13/1.45</div><small>Works with BIBD and Baiduri bank statements. Currency in BND.</small></div>
  <div class="row"><div class="meta">eyebrow 12/wide</div><span class="eyebrow">Monthly Salary</span></div>
  <div class="row"><div class="meta">numeric 28</div><div class="num">BND 4,250.00</div></div>
</div>
</body></html>
