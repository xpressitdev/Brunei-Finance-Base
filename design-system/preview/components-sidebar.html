<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:0;background:#fff;font-family:var(--app-font-sans)}
  .nav{width:240px;background:hsl(var(--sidebar));border-right:1px solid hsl(var(--sidebar-border));padding:16px 12px;height:100%}
  .brand{display:flex;align-items:center;gap:8px;padding:6px 8px 18px}
  .brand .tile{width:28px;height:28px;border-radius:8px;background:hsl(var(--primary));color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
  .brand .name{font-size:18px;font-weight:700;color:hsl(var(--primary))}
  .item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;color:hsl(var(--sidebar-foreground));font-weight:500;margin-bottom:2px}
  .item.active{background:hsl(var(--primary));color:#fff}
  .item.idle:hover{background:hsl(var(--sidebar-accent))}
  .ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
</style></head>
<body>
<div class="nav">
  <div class="brand"><div class="tile">D</div><div class="name">DuitPlan</div></div>
  <div class="item idle"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9h6M9 13h4"/></svg> DuitPlan AI</div>
  <div class="item active"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Dashboard</div>
  <div class="item idle"><svg class="ico" viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l7-5 7 5v11"/></svg> Accounts</div>
  <div class="item idle"><svg class="ico" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 9h16M9 13h6"/></svg> Transactions</div>
  <div class="item idle"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18M12 3v18"/></svg> Budgets</div>
  <div class="item idle"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg> Goals</div>
</div>
</body></html>
