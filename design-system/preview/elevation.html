<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:30px;background:hsl(var(--background));font-family:var(--app-font-sans)}
  .row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .card{background:#fff;border:1px solid hsl(var(--card-border));border-radius:12px;width:96px;height:72px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:hsl(var(--muted-foreground))}
  .s-xs{box-shadow:var(--shadow-xs)}
  .s-sm{box-shadow:var(--shadow-sm)}
  .s-md{box-shadow:var(--shadow-md)}
  .s-lg{box-shadow:var(--shadow-lg)}
  .s-xl{box-shadow:var(--shadow-xl)}
</style></head>
<body>
<div class="row">
  <div class="card s-xs">xs</div>
  <div class="card s-sm">sm</div>
  <div class="card s-md">md</div>
  <div class="card s-lg">lg</div>
  <div class="card s-xl">xl</div>
</div>
</body></html>
