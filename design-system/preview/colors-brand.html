<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:#fff}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:6px;width:120px}
  .sw .chip{height:64px;border-radius:10px;border:1px solid hsl(var(--border))}
  .sw .lbl{font-size:11px;color:hsl(var(--muted-foreground));font-family:var(--app-font-mono);line-height:1.3}
  .sw .name{font-size:12px;font-weight:600;color:hsl(var(--foreground))}
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:hsl(162 70% 35%)"></div><div class="name">primary</div><div class="lbl">162 70% 35%</div></div>
  <div class="sw"><div class="chip" style="background:hsl(162 40% 92%)"></div><div class="name">accent</div><div class="lbl">162 40% 92%</div></div>
  <div class="sw"><div class="chip" style="background:hsl(160 20% 97%)"></div><div class="name">sidebar</div><div class="lbl">160 20% 97%</div></div>
  <div class="sw"><div class="chip" style="background:hsl(160 20% 99%)"></div><div class="name">background</div><div class="lbl">160 20% 99%</div></div>
  <div class="sw"><div class="chip" style="background:hsl(164 40% 15%)"></div><div class="name">foreground</div><div class="lbl">164 40% 15%</div></div>
</div>
</body></html>
