<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--app-font-sans)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{position:relative;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;font-family:inherit}
  .primary{background:hsl(var(--primary));color:#fff;border-color:hsl(162 70% 27%)}
  .secondary{background:hsl(var(--secondary));color:hsl(var(--secondary-foreground));border-color:hsl(160 20% 82%)}
  .outline{background:#fff;color:hsl(var(--foreground));border-color:rgba(0,0,0,.10);box-shadow:var(--shadow-xs)}
  .ghost{background:transparent;color:hsl(var(--foreground));border-color:transparent}
  .destructive{background:hsl(var(--destructive));color:#fff}
  .sm{height:32px;padding:0 12px;font-size:12px}
  .lg{height:40px;padding:0 32px;font-size:15px}
  svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body>
<div class="row">
  <button class="btn primary">Add Transaction</button>
  <button class="btn outline">Import Statement</button>
  <button class="btn secondary">Cancel</button>
  <button class="btn ghost">Sign In</button>
  <button class="btn destructive">Delete</button>
</div>
<div style="height:14px"></div>
<div class="row">
  <button class="btn primary sm">Confirm</button>
  <button class="btn primary">Default</button>
  <button class="btn primary lg">Start Planning Free
    <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</div>
</body></html>
