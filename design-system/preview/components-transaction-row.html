<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:18px;background:hsl(var(--background));font-family:var(--app-font-sans)}
  .stack{display:flex;flex-direction:column;gap:10px}
  .card{background:#fff;border:1px solid hsl(var(--card-border));border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-sm)}
  .row{display:flex;justify-content:space-between;align-items:center}
  .top{display:flex;align-items:center;gap:10px}
  .dot{width:8px;height:8px;border-radius:9999px}
  .desc{font-size:14px;font-weight:500}
  .meta{font-size:12px;color:hsl(var(--muted-foreground));margin-top:2px;display:flex;gap:6px;align-items:center}
  .amt{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .amt.neg{color:#e11d48}
  .amt.pos{color:#047857}
  .chip{background:#dbeafe;color:#1d4ed8;font-size:10px;font-weight:600;padding:2px 8px;border-radius:9999px}
</style></head>
<body>
<div class="stack">
  <div class="card row">
    <div><div class="desc">Hari Gaji — April</div><div class="meta">25 Apr · Income <span class="chip">BIBD</span></div></div>
    <div class="amt pos">+BND 4,250.00</div>
  </div>
  <div class="card row">
    <div><div class="desc">Shell — Petrol Tutong</div><div class="meta">22 Apr · Transport <span class="chip">BIBD</span></div></div>
    <div class="amt neg">−BND 48.50</div>
  </div>
  <div class="card row">
    <div><div class="desc">Hua Ho Mata-Mata</div><div class="meta">21 Apr · Groceries <span class="chip">Baiduri</span></div></div>
    <div class="amt neg">−BND 132.40</div>
  </div>
</div>
</body></html>
