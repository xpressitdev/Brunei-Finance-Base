<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:18px;background:hsl(var(--background));font-family:var(--app-font-sans)}
  .card{background:#fff;border:1px solid hsl(var(--card-border));border-radius:12px;padding:24px;text-align:center}
  .em{font-size:32px;margin-bottom:6px}
  .ttl{font-size:15px;font-weight:600;margin-bottom:4px}
  .desc{font-size:13px;color:hsl(var(--muted-foreground));margin-bottom:14px;max-width:340px;margin-left:auto;margin-right:auto}
  .row{display:flex;gap:8px;justify-content:center}
  .btn{height:32px;padding:0 14px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid transparent;cursor:pointer;font-family:inherit}
  .primary{background:hsl(var(--primary));color:#fff}
  .outline{background:#fff;border-color:rgba(0,0,0,.10);color:hsl(var(--foreground));box-shadow:var(--shadow-xs)}
</style></head>
<body>
<div class="card">
  <div class="em">📊</div>
  <div class="ttl">No spending data yet</div>
  <div class="desc">Upload your BIBD or Baiduri statement, or add a transaction manually.</div>
  <div class="row">
    <button class="btn outline">Import Statement</button>
    <button class="btn primary">Add Transaction</button>
  </div>
</div>
</body></html>
