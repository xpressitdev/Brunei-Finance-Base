          type: string
        file:
          type: string
          format: binary
      required:
        - bankType
        - file

    UploadedDocument:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        fileName:
          type: string
        storagePath:
          type: string
        bankType:
          type: string
        parseStatus:
          type: string
        uploadedAt:
          type: string
        rowCount:
          type: integer
      required:
        - id
        - userId
        - fileName
        - storagePath
        - bankType
        - parseStatus
        - uploadedAt
        - rowCount

    ImportedTransactionRow:
      type: object
      properties:
        id:
          type: string
        uploadedDocumentId:
          type: string
        rawDate:
          type: ["string", "null"]
        rawDescription:
          type: ["string", "null"]
        rawAmount:
          type: ["string", "null"]
        normalizedDate:
          type: ["string", "null"]
        normalizedDescription:
          type: ["string", "null"]
        normalizedAmount:
          type: ["string", "null"]
        type:
          type: ["string", "null"]
        categorySuggestion:
          type: ["string", "null"]
        confidence:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string
        isPossibleDuplicate:
          type: boolean
          description: True if an existing transaction has the same date, amount and type for this user.
      required:
        - id
        - uploadedDocumentId
        - status
        - createdAt

    ConfirmImportBody:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ConfirmImportRow"
      required:
        - rows

    ConfirmImportRow:
      type: object
      properties:
        rowId:
          type: string
        categoryId:
          type: ["string", "null"]
        skip:
          type: boolean
      required:
        - rowId
        - skip

    ImportConfirmResult:
      type: object
      properties:
        imported:
          type: integer
        skipped:
          type: integer
      required:
        - imported
        - skipped

    # Subscription
    SubscriptionPlan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: string
        billingInterval:
          type: string
        features:
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - price
        - billingInterval
        - features
        - createdAt
        - updatedAt

    # Asset Entries
    AssetEntry:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        category:
          type: string
          enum: [Savings, Property, Vehicle, Investment, Business, Other]
        name:
          type: string
        value:
          type: string
        month:
          type: string
          description: "YYYY-MM format"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - category
        - name
        - value
        - month
        - createdAt
        - updatedAt

    AssetMatrixCell:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
      required: [id, value]

    AssetMatrixRow:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
          enum: [Savings, Property, Vehicle, Investment, Business, Other]
        entries:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AssetMatrixCell"
          description: "Map of YYYY-MM → cell. Cells with no explicit entry are omitted."
        seedValue:
          type: ["string", "null"]
          description: "Latest known value strictly before the window, used by the client to render carry-forward placeholders."
        seedMonth:
          type: ["string", "null"]
      required: [name, category, entries]

    AssetMatrix:
      type: object
      properties:
        months:
          type: array
          items:
            type: string
          description: "Window months in YYYY-MM, oldest → newest."
        rows:
          type: array
          items:
            $ref: "#/components/schemas/AssetMatrixRow"
      required: [months, rows]

    UpsertAssetCellBody:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
          enum: [Savings, Property, Vehicle, Investment, Business, Other]
        month:
          type: string
          description: "YYYY-MM format"
        value:
          type: string
      required: [name, category, month, value]

    CreateAssetBody:
      type: object
      properties:
        category:
          type: string
          enum: [Savings, Property, Vehicle, Investment, Business, Other]
        name:
          type: string
        value:
          type: string
        month:
          type: string
          description: "YYYY-MM format"
      required:
        - category
        - name
        - value
        - month

    UpdateAssetBody:
      type: object
      properties:
        category:
          type: ["string", "null"]
          enum: [Savings, Property, Vehicle, Investment, Business, Other, null]
        name:
          type: ["string", "null"]
        value:
          type: ["string", "null"]
        month:
          type: ["string", "null"]

    RenameAssetRowBody:
      type: object
      properties:
        oldName:
          type: string
        oldCategory:
          type: string
          enum: [Savings, Property, Vehicle, Investment, Business, Other]
        newName:
          type: string
        newCategory:
          type: string
          enum: [Savings, Property, Vehicle, Investment, Business, Other]
      required: [oldName, oldCategory, newName, newCategory]

    AssetRowMutationResult:
      type: object
      properties:
        affected:
          type: integer
      required: [affected]

    ListAssetsQueryParams:
      type: object
      properties:
        month:
          type: ["string", "null"]

    # Net Worth
    NetWorthSnapshot:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        month:
          type: string
          description: "YYYY-MM format"
        netWorth:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - month
        - netWorth
        - createdAt
        - updatedAt

    UpsertNetWorthSnapshotBody:
      type: object
      properties:
        month:
          type: string
          description: "YYYY-MM format"
        netWorth:
          type: string
        notes:
          type: ["string", "null"]
      required:
        - month
        - netWorth

    NetWorthTimelinePoint:
      type: object
      properties:
        month:
          type: string
          description: "YYYY-MM format"
        assets:
          type: string
          description: "Total assets at this month (decimal string)"
        liabilities:
          type: string
          description: "Total liabilities at this month (decimal string)"
        netWorth:
          type: string
          description: "assets − liabilities (decimal string)"
      required:
        - month
        - assets
        - liabilities
        - netWorth

    NetWorthTimeline:
      type: object
      properties:
        range:
          type: string
          enum: ["6m", "1y", "5y", "all"]
        startMonth:
          type: string
        endMonth:
          type: string
        cashIncludedFromMonth:
          type: string
          description: "Account-balance cash is only counted from this month onward (current month)."
        liabilitiesApproximation:
          type: string
          enum: ["current_only"]
          description: "Indicates that past-month liabilities are approximated using current debt balances."
        series:
          type: array
          items:
            $ref: "#/components/schemas/NetWorthTimelinePoint"
      required:
        - range
        - startMonth
        - endMonth
        - cashIncludedFromMonth
        - liabilitiesApproximation
        - series

    DeleteNetWorthSnapshotParams:
      type: object
      properties:
        id:
          type: string
      required:
        - id

    # Goal
    Goal:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        title:
          type: string
        category:
