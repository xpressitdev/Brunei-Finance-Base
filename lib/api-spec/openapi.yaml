openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DuitPlan API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: profile
    description: User profile operations
  - name: onboarding
    description: Onboarding operations
  - name: accounts
    description: Bank account operations
  - name: categories
    description: Category operations
  - name: commitments
    description: Monthly commitment operations
  - name: transactions
    description: Transaction operations
  - name: budgets
    description: Monthly budget operations
  - name: debts
    description: Debt management operations
  - name: insights
    description: Financial insights operations
  - name: dashboard
    description: Dashboard summary operations
  - name: uploads
    description: Statement upload operations
  - name: subscription
    description: Subscription operations
  - name: goals
    description: Financial goal operations
  - name: net-worth
    description: Net worth snapshot operations
  - name: assets
    description: Asset entry operations
  - name: receipt
    description: Receipt scanning operations
  - name: storage
    description: Object storage operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "204":
          description: Logged out

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password-reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        "200":
          description: Always success — response is identical whether or not the email is registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Complete a password reset using a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleOkResponse"
        "400":
          description: Invalid or expired token, or weak password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify a user's email using a token from the verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailBody"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleOkResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend the email-verification link to the currently signed-in user
      responses:
        "200":
          description: Email queued (or no-op if already verified)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleOkResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Update the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleOkResponse"
        "400":
          description: Weak new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong current password or not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Profile
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profile/reset-data:
    post:
      operationId: resetUserData
      tags: [profile]
      summary: Wipe all of the current user's financial data while keeping their account, profile, and subscription
      responses:
        "200":
          description: Reset summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetDataResponse"

  # Onboarding
  /onboarding/status:
    get:
      operationId: getOnboardingStatus
      tags: [onboarding]
      summary: Get user onboarding completion status
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"

  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: Mark onboarding as complete
      responses:
        "200":
          description: Onboarding marked complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"

  # Accounts
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List user bank accounts
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

    post:
      operationId: createAccount
      tags: [accounts]
      summary: Create a bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountBody"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /accounts/{id}/balance-history:
    get:
      operationId: getAccountBalanceHistory
      tags: [accounts]
      summary: Get daily balance history for an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: number
            default: 30
      responses:
        "200":
          description: Daily balance snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalanceHistoryPoint"

  /accounts/{id}:
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update a bank account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountBody"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

    delete:
      operationId: deleteAccount
      tags: [accounts]
      summary: Delete a bank account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # Categories
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a custom category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Rename a custom category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryBody"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a custom category (defaults are protected)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # Commitments
  /commitments:
    get:
      operationId: listCommitments
      tags: [commitments]
      summary: List user monthly commitments
      responses:
        "200":
          description: List of commitments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Commitment"

    post:
      operationId: createCommitment
      tags: [commitments]
      summary: Create a commitment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommitmentBody"
      responses:
        "201":
          description: Commitment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"

  /commitments/{id}:
    patch:
      operationId: updateCommitment
      tags: [commitments]
      summary: Update a commitment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommitmentBody"
      responses:
        "200":
          description: Updated commitment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Commitment"

    delete:
      operationId: deleteCommitment
      tags: [commitments]
      summary: Delete a commitment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # Transactions
  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List transactions with filters
      parameters:
        - name: month
          in: query
          schema:
            type: ["string", "null"]
          description: "Filter by month (YYYY-MM format)"
        - name: categoryId
          in: query
          schema:
            type: ["string", "null"]
        - name: accountId
          in: query
          schema:
            type: ["string", "null"]
        - name: type
          in: query
          schema:
            type: ["string", "null"]
          description: "debit or credit"
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a manual transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionBody"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionBody"
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # Budgets
  /budgets:
    get:
      operationId: listBudgets
      tags: [budgets]
      summary: List monthly budget allocations
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
          description: "Month in YYYY-MM format"
      responses:
        "200":
          description: List of budget allocations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyBudget"

    post:
      operationId: upsertBudget
      tags: [budgets]
      summary: Create or update a budget allocation for a category/month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertBudgetBody"
      responses:
        "200":
          description: Budget saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyBudget"

  # Debts
  /debts:
    get:
      operationId: listDebts
      tags: [debts]
      summary: List user debts
      responses:
        "200":
          description: List of debts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Debt"

    post:
      operationId: createDebt
      tags: [debts]
      summary: Create a debt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDebtBody"
      responses:
        "201":
          description: Debt created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"

  /debts/{id}:
    patch:
      operationId: updateDebt
      tags: [debts]
      summary: Update a debt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDebtBody"
      responses:
        "200":
          description: Updated debt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Debt"

    delete:
      operationId: deleteDebt
      tags: [debts]
      summary: Delete a debt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /debts/{id}/simulate:
    post:
      operationId: simulateDebtPayoff
      tags: [debts]
      summary: Simulate debt payoff with extra monthly payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebtSimulateBody"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebtScenario"

  /debts/{id}/schedule:
    get:
      operationId: getDebtSchedule
      tags: [debts]
      summary: Get monthly balance schedule for a debt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Monthly balance schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebtSchedule"
        "404":
          description: Debt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Insights
  /insights:
    get:
      operationId: listInsights
      tags: [insights]
      summary: Get financial insights for a month
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
          description: "Month in YYYY-MM format"
      responses:
        "200":
          description: List of insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Insight"

  /insights/generate:
    post:
      operationId: generateInsights
      tags: [insights]
      summary: Generate/refresh insights for a month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateInsightsBody"
      responses:
        "200":
          description: Generated insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Insight"

  # Dashboard
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get monthly dashboard summary
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
          description: "Month in YYYY-MM format"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/spending-by-category:
    get:
      operationId: getSpendingByCategory
      tags: [dashboard]
      summary: Get spending breakdown by category for a month
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
          description: "Month in YYYY-MM format"
      responses:
        "200":
          description: Spending by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategorySpend"

  /dashboard/recent-transactions:
    get:
      operationId: getRecentTransactions
      tags: [dashboard]
      summary: Get recent transactions for dashboard
      parameters:
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Recent transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  # Uploads
  /uploads:
    post:
      operationId: uploadStatement
      tags: [uploads]
      summary: Upload a bank statement PDF
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadStatementBody"
      responses:
        "201":
          description: Document uploaded and parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedDocument"

  /uploads/{id}/rows:
    get:
      operationId: getImportedRows
      tags: [uploads]
      summary: Get parsed transaction rows for review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parsed rows for review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportedTransactionRow"

  /uploads/{id}/confirm:
    post:
      operationId: confirmImport
      tags: [uploads]
      summary: Confirm import of reviewed transaction rows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmImportBody"
      responses:
        "200":
          description: Import confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportConfirmResult"

  # Net Worth
  /net-worth:
    get:
      operationId: listNetWorthSnapshots
      tags: [net-worth]
      summary: List user net worth snapshots (read-only; use /assets for new entries)
      parameters:
        - name: year
          in: query
          schema:
            type: ["string", "null"]
          description: "Filter by year (YYYY format)"
      responses:
        "200":
          description: List of net worth snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NetWorthSnapshot"

  /net-worth/timeline:
    get:
      operationId: getNetWorthTimeline
      tags: [net-worth]
      summary: Net worth time series for charting
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: ["6m", "1y", "5y", "all"]
            default: "1y"
          description: "Time window: 6m, 1y, 5y, or all (capped at 10 years)."
      responses:
        "200":
          description: Net worth timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetWorthTimeline"

  # Asset Entries
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List user asset entries for a month
      parameters:
        - name: month
          in: query
          schema:
            type: ["string", "null"]
          description: "Filter by month (YYYY-MM format)"
      responses:
        "200":
          description: List of asset entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetEntry"

    post:
      operationId: createAsset
      tags: [assets]
      summary: Create an asset entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetBody"
      responses:
        "201":
          description: Asset entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetEntry"

  /assets/matrix:
    get:
      operationId: getAssetMatrix
      tags: [assets]
      summary: Get the grid editor matrix of asset entries (rows × months)
      parameters:
        - name: months
          in: query
          schema:
            type: ["integer", "null"]
          description: "Number of months to include (default 12, max 60)"
      responses:
        "200":
          description: Asset matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetMatrix"

  /assets/cell:
    put:
      operationId: upsertAssetCell
      tags: [assets]
      summary: Upsert a single asset entry by (name, category, month)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertAssetCellBody"
      responses:
        "200":
          description: Updated asset entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetEntry"
        "201":
          description: Created asset entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetEntry"
    delete:
      operationId: deleteAssetCell
      tags: [assets]
      summary: Delete the explicit asset entry for a single (name, category, month) cell
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: category
          in: query
          required: true
          schema:
            type: string
        - name: month
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /assets/row:
    patch:
      operationId: renameAssetRow
      tags: [assets]
      summary: Rename a (name, category) pair across all of its asset entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameAssetRowBody"
      responses:
        "200":
          description: Number of entries updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetRowMutationResult"
    delete:
      operationId: deleteAssetRow
      tags: [assets]
      summary: Delete every asset entry for a (name, category) pair
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: category
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Number of entries deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetRowMutationResult"

  /assets/{id}:
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetBody"
      responses:
        "200":
          description: Updated asset entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetEntry"

    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Delete an asset entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # Goals
  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List user financial goals
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"

    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a financial goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalBody"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a financial goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalBody"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a financial goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # Income Sources (variable-income users)
  /income-sources:
    get:
      operationId: listIncomeSources
      tags: [incomeSources]
      summary: List user income sources
      responses:
        "200":
          description: List of income sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncomeSource"
    post:
      operationId: createIncomeSource
      tags: [incomeSources]
      summary: Create an income source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncomeSourceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeSource"

  /income-sources/{id}:
    patch:
      operationId: updateIncomeSource
      tags: [incomeSources]
      summary: Update an income source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIncomeSourceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomeSource"
    delete:
      operationId: deleteIncomeSource
      tags: [incomeSources]
      summary: Delete an income source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # Subscription
  /subscription/plans:
    get:
      operationId: listSubscriptionPlans
      tags: [subscription]
      summary: List available subscription plans
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"

  /subscription/current:
    get:
      operationId: getCurrentSubscription
      tags: [subscription]
      summary: Get current user subscription
      responses:
        "200":
          description: Current subscription or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSubscription"
        "404":
          description: No active subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Receipt scanning
  /receipt/scan:
    post:
      operationId: scanReceipt
      tags: [receipt]
      summary: Scan a receipt image and extract expense data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanReceiptBody"
      responses:
        "200":
          description: Extracted receipt data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanReceiptResponse"

  # Storage
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL for object storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

components:
  schemas:
    ScanReceiptBody:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64-encoded compressed image data
        mimeType:
          type: string
          description: MIME type of the image (e.g. image/jpeg)
      required:
        - imageBase64
        - mimeType

    ScanReceiptResponse:
      type: object
      properties:
        merchant:
          type: ["string", "null"]
        amount:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        categoryId:
          type: ["string", "null"]
          description: Server-resolved category id for `category` (exact or case-insensitive name match), or null if no match.

    RequestUploadUrlBody:
      type: object
      properties:
        name:
          type: string
        size:
          type: number
        contentType:
          type: string
      required:
        - name
        - size
        - contentType

    RequestUploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
      required:
        - uploadURL
        - objectPath

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # Auth schemas
    RegisterBody:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
      required:
        - fullName
        - email
        - password

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password

    ForgotPasswordBody:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    ForgotPasswordResponse:
      type: object
      properties:
        ok:
          type: boolean
        devResetUrl:
          type: ["string", "null"]
          description: Only populated outside production so QA can complete the flow without an inbox.
      required:
        - ok

    ResetPasswordBody:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 10
      required:
        - token
        - password

    VerifyEmailBody:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
        - token

    ChangePasswordBody:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 10
      required:
        - currentPassword
        - newPassword

    SimpleOkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        onboardingCompleted:
          type: boolean
        emailVerified:
          type: boolean
        passwordWeak:
          type: boolean
        profile:
          $ref: "#/components/schemas/Profile"
      required:
        - id
        - email
        - onboardingCompleted
        - emailVerified
        - passwordWeak

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        devVerificationUrl:
          type: ["string", "null"]
          description: Only populated outside production so QA can complete email verification without an inbox.
      required:
        - user

    # Profile
    Profile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        fullName:
          type: string
        currency:
          type: string
        region:
          type: string
        locale:
          type: string
        language:
          type: string
        payday:
          type: integer
        monthlyIncome:
          type: string
        incomeType:
          type: string
          enum: [fixed, variable]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - fullName
        - currency
        - region
        - locale
        - language
        - payday
        - monthlyIncome
        - incomeType
        - createdAt
        - updatedAt

    UpdateProfileBody:
      type: object
      properties:
        fullName:
          type: ["string", "null"]
        payday:
          type: ["integer", "null"]
        monthlyIncome:
          type: ["string", "null"]
        currency:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        locale:
          type: ["string", "null"]
        language:
          type: ["string", "null"]
        incomeType:
          type: ["string", "null"]
          enum: [fixed, variable, null]

    ResetDataResponse:
      type: object
      properties:
        ok:
          type: boolean
        deleted:
          type: object
          additionalProperties:
            type: integer
      required:
        - ok
        - deleted

    # Onboarding
    OnboardingStatus:
      type: object
      properties:
        completed:
          type: boolean
        currentStep:
          type: ["integer", "null"]
      required:
        - completed

    # Account
    Account:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        type:
          type: string
        bankName:
          type: ["string", "null"]
        balance:
          type: string
          description: Current account balance in BND (numeric string)
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - name
        - type
        - balance
        - createdAt
        - updatedAt

    CreateAccountBody:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        bankName:
          type: ["string", "null"]
        balance:
          type: string
          description: Initial balance in BND
      required:
        - name
        - type

    UpdateAccountBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        type:
          type: ["string", "null"]
        bankName:
          type: ["string", "null"]
        balance:
          type: ["string", "null"]
          description: Updated balance in BND

    BalanceHistoryPoint:
      type: object
      properties:
        date:
          type: string
          description: ISO date string (YYYY-MM-DD)
        balance:
          type: number
          description: Account balance at end of that day
      required:
        - date
        - balance

    # Category
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
        isDefault:
          type: boolean
        defaultBudget:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          description: |
            BND/month suggested target shown on the envelope bar. Stringified
            non-negative decimal with up to 2 fractional digits (matches the
            pg numeric(12,2) backing column). Example: "150.00".
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - kind
        - isDefault
        - defaultBudget
        - createdAt
        - updatedAt

    CreateCategoryBody:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
        defaultBudget:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          default: "0"
          description: |
            BND/month suggested target shown on the envelope bar. Stringified
            non-negative decimal with up to 2 fractional digits. Defaults to "0".
      required:
        - name
        - kind

    UpdateCategoryBody:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
        defaultBudget:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          description: |
            BND/month suggested target shown on the envelope bar. Stringified
            non-negative decimal with up to 2 fractional digits.

    # Commitment
    Commitment:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        label:
          type: string
        amount:
          type: string
        dueDay:
          type: ["integer", "null"]
        recurrence:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - label
        - amount
        - recurrence
        - createdAt
        - updatedAt

    CreateCommitmentBody:
      type: object
      properties:
        label:
          type: string
        amount:
          type: string
        dueDay:
          type: ["integer", "null"]
        recurrence:
          type: string
      required:
        - label
        - amount

    UpdateCommitmentBody:
      type: object
      properties:
        label:
          type: ["string", "null"]
        amount:
          type: ["string", "null"]
        dueDay:
          type: ["integer", "null"]
        recurrence:
          type: ["string", "null"]

    # Transaction
    Transaction:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        accountId:
          type: ["string", "null"]
        categoryId:
          type: ["string", "null"]
        categoryName:
          type: ["string", "null"]
        accountName:
          type: ["string", "null"]
        date:
          type: string
        amount:
          type: string
        type:
          type: string
        description:
          type: string
        merchant:
          type: ["string", "null"]
        source:
          type: string
        notes:
          type: ["string", "null"]
        receiptUrl:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - date
        - amount
        - type
        - description
        - source
        - createdAt
        - updatedAt

    CreateTransactionBody:
      type: object
      properties:
        date:
          type: string
        amount:
          type: string
        type:
          type: string
        description:
          type: string
        merchant:
          type: ["string", "null"]
        categoryId:
          type: ["string", "null"]
        accountId:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        receiptUrl:
          type: ["string", "null"]
        source:
          type: string
      required:
        - date
        - amount
        - type
        - description

    UpdateTransactionBody:
      type: object
      properties:
        date:
          type: ["string", "null"]
        amount:
          type: ["string", "null"]
        type:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        merchant:
          type: ["string", "null"]
        categoryId:
          type: ["string", "null"]
        accountId:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    # Budget
    MonthlyBudget:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        categoryId:
          type: string
        categoryName:
          type: string
        month:
          type: string
        plannedAmount:
          type: string
        actualAmount:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - categoryId
        - categoryName
        - month
        - plannedAmount
        - actualAmount
        - createdAt
        - updatedAt

    UpsertBudgetBody:
      type: object
      properties:
        categoryId:
          type: string
        month:
          type: string
        plannedAmount:
          type: string
      required:
        - categoryId
        - month
        - plannedAmount

    # Debt
    Debt:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        debtType:
          type: string
        lender:
          type: string
        outstandingBalance:
          type: string
        monthlyPayment:
          type: string
        interestRate:
          type: ["string", "null"]
        targetExtraPayment:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
          description: "Debt start date in YYYY-MM-DD format"
        endDate:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId
        - debtType
        - lender
        - outstandingBalance
        - monthlyPayment
        - createdAt
        - updatedAt

    CreateDebtBody:
      type: object
      properties:
        debtType:
          type: string
        lender:
          type: string
        outstandingBalance:
          type: string
        monthlyPayment:
          type: string
        interestRate:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
          description: "Debt start date in YYYY-MM-DD format"
        paidThisMonth:
          type: ["boolean", "null"]
          description: "If true, the server creates a linked debit transaction for the current month so dashboard reconciliation treats this debt as already paid."
      required:
        - debtType
        - lender
        - outstandingBalance
        - monthlyPayment

    UpdateDebtBody:
      type: object
      properties:
        debtType:
          type: ["string", "null"]
        lender:
          type: ["string", "null"]
        outstandingBalance:
          type: ["string", "null"]
        monthlyPayment:
          type: ["string", "null"]
        interestRate:
          type: ["string", "null"]
        targetExtraPayment:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
          description: "Debt start date in YYYY-MM-DD format"

    DebtSimulateBody:
      type: object
      properties:
        extraMonthlyPayment:
          type: string
      required:
        - extraMonthlyPayment

    DebtScenario:
      type: object
      properties:
        id:
          type: string
        debtId:
          type: string
        extraMonthlyPayment:
          type: string
        estimatedMonthsSaved:
          type: ["integer", "null"]
        estimatedPayoffDate:
          type: ["string", "null"]
        basePayoffMonths:
          type: ["integer", "null"]
        newPayoffMonths:
          type: ["integer", "null"]
        createdAt:
          type: string
      required:
        - id
        - debtId
        - extraMonthlyPayment
        - createdAt

    DebtSchedulePoint:
      type: object
      properties:
        month:
          type: integer
          description: "Month number (0 = start)"
        balance:
          type: number
          description: "Outstanding balance at this month"
        label:
          type: ["string", "null"]
          description: "YYYY-MM calendar label derived from startDate, if debt has a startDate"
      required:
        - month
        - balance

    DebtSchedule:
      type: object
      properties:
        debtId:
          type: string
        schedule:
          type: array
          items:
            $ref: "#/components/schemas/DebtSchedulePoint"
      required:
        - debtId
        - schedule

    # Insights
    Insight:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        month:
          type: string
        title:
          type: string
        message:
          type: string
        severity:
          type: string
        createdAt:
          type: string
      required:
        - id
        - userId
        - month
        - title
        - message
        - severity
        - createdAt

    GenerateInsightsBody:
      type: object
      properties:
        month:
          type: string
      required:
        - month

    # Dashboard
    DashboardSummary:
      type: object
      properties:
        month:
          type: string
        monthlyIncome:
          type: string
        actualIncomeThisMonth:
          type: string
          description: Sum of credit transactions in the current month
        totalCommitments:
          type: string
        totalSpent:
          type: string
        remaining:
          type: string
        totalDebtMonthlyPayment:
          type: string
        totalDebtPayments:
          type: string
        debtToIncomeRatio:
          type: string
        transactionCount:
          type: integer
      required:
        - month
        - monthlyIncome
        - actualIncomeThisMonth
        - totalCommitments
        - totalSpent
        - remaining
        - totalDebtMonthlyPayment
        - totalDebtPayments
        - debtToIncomeRatio
        - transactionCount

    CategorySpend:
      type: object
      properties:
        categoryId:
          type: ["string", "null"]
        categoryName:
          type: string
        totalSpent:
          type: number
        percentage:
          type: number
        budget:
          type: ["number", "null"]
          description: "Monthly default_budget for this category. null when unset (0)."
        percentOfBudget:
          type: ["number", "null"]
          description: "0..100+ percentage of budget spent. null when budget is null."
        status:
          type: string
          enum: [on_track, warning, over, no_budget]
          description: "Bar colour bucket. no_budget when budget is null."
      required:
        - categoryName
        - totalSpent
        - percentage
        - status

    # Upload
    UploadStatementBody:
      type: object
      properties:
