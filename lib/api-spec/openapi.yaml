        - targetAmount

    UpdateGoalBody:
      type: object
      properties:
        title:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
          enum: [savings, emergency, debt_payoff, investment, custom]
        targetAmount:
          type: ["string", "null"]
        savedAmount:
          type: ["string", "null"]
        deadline:
          type: ["string", "null"]
          format: date
        notes:
          type: ["string", "null"]

